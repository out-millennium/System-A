events {}

http {
    # ---- Baseline security headers (both http + https server blocks) ----
    # `always` => also sent on error responses. nginx REPLACES (not merges)
    # add_header inheritance when a block declares its own, so the full set is
    # repeated in each server block below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # ---- Rate limiting zones ----
    # Keyed by the real client IP. The public edge below overwrites forwarding
    # headers instead of trusting client-supplied X-Forwarded-For values. If a
    # CDN sits in front, configure nginx realip_module with an explicit trusted
    # proxy list before changing this key.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_status 429;

    upstream frontend { server frontend:3000; }
    upstream core     { server core:8000; }
    upstream grm      { server grm:8001; }

    # ---- HTTP :80 — redirect everything to HTTPS ----
    # Exception: keep a plain /health so container/orchestrator health checks
    # and load balancers don't need TLS.
    server {
        listen 80;
        server_name system-a.win;

        location = /health {
            proxy_pass http://core/health;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS :443 ----
    server {
        listen 443 ssl;
        server_name system-a.win;

        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Re-declare baseline headers + HSTS + CSP here (inheritance is replaced).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Next.js emits a per-request nonce-based CSP from proxy.ts. Do not add
        # a second static CSP here: duplicate policies are intersected by browsers
        # and would accidentally block nonce-bearing Next runtime scripts.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # Never expose scrape endpoints to the public: Prometheus reaches Core/
        # GRM directly over the Docker network, so this only blocks outsiders.
        location = /metrics { return 404; }

        location = /health {
            proxy_pass http://core/health;
        }

        # Auth endpoints get a stricter limit (login brute-force protection).
        # burst allows short bursts; nodelay serves them immediately then throttles.
        location = /login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }

        # API routes (Next.js /api/*): general rate limit.
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            # Correlation id for tracing across nginx → app → Core.
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
